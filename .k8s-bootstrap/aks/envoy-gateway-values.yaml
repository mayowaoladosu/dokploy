crds:
  enabled: true

commonLabels:
  app.kubernetes.io/managed-by: vlyv

podDisruptionBudget:
  minAvailable: 2

deployment:
  replicas: 3
  envoyGateway:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  pod:
    nodeSelector:
      vlyv.dev/pool: system
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            control-plane: envoy-gateway
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            control-plane: envoy-gateway

hpa:
  enabled: false

createNamespace: false

config:
  envoyGateway:
    logging:
      level:
        default: info
      encoder: JSON
    extensionApis:
      enableEnvoyPatchPolicy: false
      disableLua: true
    provider:
      type: Kubernetes
      kubernetes:
        watch:
          type: NamespaceSelector
          namespaceSelector:
            matchLabels:
              vlyv.dev/managed: "true"