apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vlyv-gateway
  namespace: vlyv-system
  labels:
    app.kubernetes.io/name: vlyv-gateway
    app.kubernetes.io/managed-by: vlyv
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              vlyv.dev/managed: "true"