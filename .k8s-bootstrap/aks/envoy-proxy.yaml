apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: vlyv-production
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: vlyv-gateway
    app.kubernetes.io/managed-by: vlyv
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
        pod:
          nodeSelector:
            vlyv.dev/pool: system
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: vlyv-gateway
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: vlyv-gateway
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        container:
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        allocateLoadBalancerNodePorts: true
      envoyHpa:
        minReplicas: 3
        maxReplicas: 9
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 70
          - type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 75
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            selectPolicy: Max
            policies:
              - type: Percent
                value: 100
                periodSeconds: 60
              - type: Pods
                value: 3
                periodSeconds: 60
          scaleDown:
            stabilizationWindowSeconds: 300
            selectPolicy: Max
            policies:
              - type: Percent
                value: 25
                periodSeconds: 60
      envoyPDB:
        minAvailable: 2
  shutdown:
    drainTimeout: 45s
    minDrainDuration: 10s
  logging:
    level:
      default: warn
  luaValidation: Strict